# 亿库官网 + AI客服 完整 Nginx 配置
# 部署路径：宝塔面板 → 网站 → guangxiyiku.com → 设置 → 配置文件
#
# 架构：
#   80/443 → Nginx → /                   → 静态官网 (/www/wwwroot/guangxiyiku.com)
#                    → /api/ai/*           → Demo Server (127.0.0.1:4180)
#                    → /api/admin/*        → Demo Server (127.0.0.1:4180)
#                    → /api/media*         → Demo Server (127.0.0.1:4180)
#                                       Demo Server → FastGPT (127.0.0.1:4181)
#                                                   → 智谱/DeepSeek API

# ── HTTP (SSL 申请前) ──
server {
    listen 80;
    server_name guangxiyiku.com www.guangxiyiku.com;

    # 静态官网
    root /www/wwwroot/guangxiyiku.com;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;
    gzip_min_length 256;

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 首页不缓存
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # AI 客服 API → Demo Server
    location /api/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

