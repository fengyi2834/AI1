<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>亿库 AI 客服</title>
  <meta name="description" content="亿库硅藻板 AI 在线客服">
  <link rel="stylesheet" href="./styles.css?v=20260527">
  <script src="./i18n.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { background: #f0f2f5; display: flex; flex-direction: column; }

    .chat-page { display: flex; flex-direction: column; height: 100%; max-width: 500px; margin: 0 auto; width: 100%; background: #fff; }

    .chat-page-head {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; background: linear-gradient(135deg, #173244, #25524a); color: #fff;
      flex-shrink: 0;
    }
    .chat-page-head .back-btn {
      width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15);
      color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .chat-page-head .head-info { flex: 1; min-width: 0; }
    .chat-page-head .head-info strong { font-size: 16px; display: block; }
    .chat-page-head .head-info span { font-size: 11px; color: rgba(255,255,255,0.7); }

    /* ── Chat Page Lang Switcher ── */
    .chat-lang-switch { position: relative; flex-shrink: 0; }
    .chat-lang-switch-toggle {
      display: flex; align-items: center; gap: 4px;
      padding: 5px 8px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1); color: #fff; font-size: 12px; cursor: pointer;
    }
    .chat-lang-switch-toggle .lang-flag { font-size: 14px; }
    .chat-lang-switch-menu {
      position: absolute; top: calc(100% + 4px); right: 0;
      background: #fff; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      min-width: 150px; overflow: hidden; z-index: 200;
    }
    .chat-lang-switch-menu button {
      display: flex; align-items: center; gap: 8px;
      width: 100%; padding: 10px 14px; border: none; background: none;
      color: #333; font-size: 13px; cursor: pointer; text-align: left;
    }
    .chat-lang-switch-menu button:hover { background: #f0f7f1; }
    .chat-lang-switch-menu button.active { background: #e8f5e9; color: #2f7a4f; font-weight: 600; }

    .chat-page-head .auth-btn {
      padding: 6px 14px; border-radius: 16px; border: none;
      background: #fff; color: #3370FF; font-size: 13px; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-weight: 600;
    }
    .chat-page-head .auth-btn.is-logged-in { background: rgba(255,255,255,0.25); color: #fff; }

    .chat-page-quick {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px;
      border-bottom: 1px solid #eee; flex-shrink: 0; overflow-x: auto;
    }
    .chat-page-quick button {
      padding: 6px 12px; border-radius: 16px; border: 1px solid #d0d5dd; background: #f9fafb;
      font-size: 12px; white-space: nowrap; cursor: pointer;
    }

    .chat-page-body { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }

    .chat-page-body .msg { display: flex; margin-bottom: 14px; }
    .chat-page-body .msg.user { justify-content: flex-end; }
    .chat-page-body .msg .bubble {
      max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.6; word-break: break-word;
    }
    .chat-page-body .msg.assistant .bubble { background: #f0f4f8; border-bottom-left-radius: 4px; }
    .chat-page-body .msg.user .bubble { background: var(--site-primary, #3370FF); color: #fff; border-bottom-right-radius: 4px; }
    .chat-page-body .msg img { max-width: 160px; max-height: 160px; border-radius: 10px; margin-bottom: 6px; display: block; }

    .chat-page-form {
      display: flex; gap: 6px; align-items: flex-end; padding: 10px 12px;
      border-top: 1px solid #eee; flex-shrink: 0; background: #fff;
    }
    .chat-page-form .img-preview-bar {
      display: none; width: 100%; padding: 6px 10px; background: #e8f5e9; border-radius: 10px;
      font-size: 12px; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .chat-page-form .img-preview-bar.show { display: flex; }
    .chat-page-form .img-preview-bar .remove { cursor: pointer; color: #c00; font-weight: bold; flex-shrink: 0; }
    .chat-page-form input {
      flex: 1; padding: 10px 14px; border: 1px solid #d0d5dd; border-radius: 20px;
      font-size: 14px; outline: none;
    }
    .chat-page-form input:focus { border-color: var(--site-primary, #3370FF); }
    .chat-page-form .img-btn {
      width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--site-primary, #3370FF);
      background: transparent; color: var(--site-primary, #3370FF); font-size: 15px;
      cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .chat-page-form .img-btn.has-img { background: var(--site-primary, #3370FF); color: #fff; }
    .chat-page-form .send-btn {
      padding: 10px 20px; border-radius: 20px; border: none; background: var(--site-primary, #3370FF);
      color: #fff; font-size: 14px; cursor: pointer; flex-shrink: 0;
    }
    .chat-page-form .send-btn:disabled { opacity: 0.5; }

    .auth-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.45); }
    .auth-dialog { background: #fff; border-radius: 16px; padding: 24px; width: 90%; max-width: 360px; }
    .auth-dialog input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #d0d5dd; border-radius: 10px; font-size: 14px; }
    .auth-dialog button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--site-primary, #3370FF); color: #fff; font-size: 15px; cursor: pointer; }
    .auth-dialog .auth-tabs { display: flex; gap: 0; margin-bottom: 16px; }
    .auth-dialog .auth-tab { flex: 1; padding: 8px; text-align: center; border-bottom: 2px solid #eee; cursor: pointer; font-size: 14px; color: #888; }
    .auth-dialog .auth-tab.active { border-bottom-color: var(--site-primary, #3370FF); color: var(--site-primary, #3370FF); font-weight: 600; }
    .auth-forgot { text-align: right; margin: -8px 0 0 0; font-size: 12px; }
    .auth-forgot a { color: #888; text-decoration: none; }
    .auth-forgot a:hover { color: var(--site-primary, #3370FF); }
    .auth-dialog .auth-error { color: #e00; font-size: 12px; margin-bottom: 8px; }
    .auth-dialog .auth-hint { font-size: 12px; color: #888; margin-bottom: 10px; }
  </style>
</head>
<body data-page="chat">
  <div class="chat-page">
    <div class="chat-page-head">
      <button class="back-btn" onclick="history.back()">&larr;</button>
      <div class="head-info">
        <strong data-i18n="chat.title">亿库 AI 客服</strong>
        <span data-i18n="chatpage.chat">在线咨询</span>
      </div>

      <!-- 语言切换器 -->
      <div class="chat-lang-switch">
        <button class="chat-lang-switch-toggle" type="button" aria-expanded="false" aria-label="切换语言">
          <span class="lang-flag"><img class="lang-flag" src="https://flagcdn.com/w20/cn.png" width="20" height="14" alt="CN" style="vertical-align:middle;border-radius:2px"></span>
        </button>
        <div class="chat-lang-switch-menu" hidden>
          <button type="button" data-lang="zh-CN"><span class="lang-flag"><img class="lang-flag" src="https://flagcdn.com/w20/cn.png" width="20" height="14" alt="CN" style="vertical-align:middle;border-radius:2px"></span><span>简体中文</span></button>
          <button type="button" data-lang="en-US"><span class="lang-flag"><img class="lang-flag" src="https://flagcdn.com/w20/us.png" width="20" height="14" alt="US" style="vertical-align:middle;border-radius:2px"></span><span>English</span></button>
          <button type="button" data-lang="ja-JP"><span class="lang-flag"><img class="lang-flag" src="https://flagcdn.com/w20/jp.png" width="20" height="14" alt="JP" style="vertical-align:middle;border-radius:2px"></span><span>日本語</span></button>
          <button type="button" data-lang="ko-KR"><span class="lang-flag"><img class="lang-flag" src="https://flagcdn.com/w20/kr.png" width="20" height="14" alt="KR" style="vertical-align:middle;border-radius:2px"></span><span>한국어</span></button>
        </div>
      </div>

      <button class="auth-btn" id="authBtn" title="登录" data-i18n-title="chat.login">登录</button>
    </div>

    <div class="chat-page-quick">
      <button data-q="你们产品适合哪些场景？" data-i18n="quick.scenarios_short">适用场景</button>
      <button data-q="学校医院能不能用？" data-i18n="quick.school_hospital_short">学校/医院</button>
      <button data-q="规格有哪些？" data-i18n="quick.specs_short">产品规格</button>
      <button data-q="怎么报价？" data-i18n="quick.pricing_short">如何报价</button>
      <button data-q="如何联系销售？" data-i18n="quick.contact_sales_short">联系销售</button>
    </div>

    <div class="chat-page-body" id="chatBody"></div>

    <div class="chat-page-form">
      <div>
        <div class="img-preview-bar" id="imgPreview">
          <span id="imgName"></span>
          <span class="remove" id="imgRemove">&times;</span>
        </div>
        <div style="display:flex;gap:4px;align-items:flex-end;position:relative">
          <button type="button" id="plusBtn" title="更多功能" style="flex-shrink:0;min-width:26px;min-height:26px;width:26px;height:26px;border:1px solid rgba(47,122,79,0.18);border-radius:50%;background:#f6faf7;color:#5b846b;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:1">+</button>
          <input type="file" accept="image/*" style="display:none" id="imgInput">
          <input type="text" id="msgInput" placeholder="请输入你的问题" autocomplete="off" data-i18n-placeholder="chat.placeholder">
          <button class="send-btn" id="sendBtn" data-i18n="chat.send">发送</button>
          <!-- + 弹出菜单 -->
          <div id="plusMenu" style="display:none;position:absolute;bottom:50px;left:14px;background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:4px;box-shadow:0 -4px 24px rgba(0,0,0,0.08);z-index:1000">
            <div data-action="emoji" style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 12px;border-radius:8px;white-space:nowrap" onmouseover="this.style.background='#f5f5f5'" onmouseout="this.style.background='transparent'"><span style="font-size:16px">😊</span><span style="font-size:13px;color:#333">表情</span></div>
            <div data-action="image" style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 12px;border-radius:8px;white-space:nowrap" onmouseover="this.style.background='#f5f5f5'" onmouseout="this.style.background='transparent'"><span style="font-size:16px">📷</span><span style="font-size:13px;color:#333">图片</span></div>
            <div data-action="handoff" style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 12px;border-radius:8px;white-space:nowrap" onmouseover="this.style.background='#f5f5f5'" onmouseout="this.style.background='transparent'"><span style="font-size:16px">🎧</span><span style="font-size:13px;color:#e74c3c">转人工</span></div>
          </div>
          <!-- 表情面板 -->
          <div id="emojiPanel" style="display:none;position:absolute;bottom:50px;right:12px;background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:999;width:300px;max-height:220px;overflow-y:auto"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="auth-overlay" id="authOverlay" hidden>
    <div class="auth-dialog">
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">登录</div>
        <div class="auth-tab" data-tab="register">注册</div>
      </div>
      <p class="auth-error" id="authError" hidden></p>
      <form id="loginForm"><input type="email" placeholder="邮箱" required><input type="password" placeholder="密码" required minlength="6"><button type="submit">登录</button></form>
      <p class="auth-forgot"><a id="forgotLink" href="javascript:;">忘记密码？</a></p>
      <form id="registerForm" hidden><input type="email" placeholder="邮箱" required><input type="password" placeholder="密码（至少6位）" required minlength="6"><input type="text" placeholder="昵称（选填）"><button type="submit">获取验证码</button></form>
      <form id="verifyForm" hidden><p class="auth-hint">验证码已发送至 <strong id="verifyEmail"></strong>，如未收到请检查垃圾邮件</p><input type="text" placeholder="6位验证码" required maxlength="6"><button type="submit">验证并激活</button></form>
      <form id="forgotForm" hidden><p class="auth-hint">输入注册邮箱，我们将发送重置验证码</p><input type="email" placeholder="注册邮箱" required><button type="submit">获取重置验证码</button></form>
      <form id="resetForm" hidden><p class="auth-hint">重置验证码已发送至 <strong id="resetEmail"></strong></p><input type="text" placeholder="6位验证码" required maxlength="6"><input type="password" placeholder="新密码（至少6位）" required minlength="6"><button type="submit">重置密码</button></form>
    </div>
  </div>

  <script>
    (function() {
      var I = window.I18N;
      var t = function(k) { return I ? I.t(k) : k; };

      var STORAGE_TOKEN = 'yiku_auth_token';
      var STORAGE_USER = 'yiku_auth_user';
      var WELCOME = t('chat.welcome');

      var body = document.getElementById('chatBody');
      var input = document.getElementById('msgInput');
      var sendBtn = document.getElementById('sendBtn');
      var authBtn = document.getElementById('authBtn');
      var authOverlay = document.getElementById('authOverlay');
      var authError = document.getElementById('authError');
      var loginForm = document.getElementById('loginForm');
      var registerForm = document.getElementById('registerForm');
      var verifyForm = document.getElementById('verifyForm');
      var verifyEmail = document.getElementById('verifyEmail');
      var imgInput = document.getElementById('imgInput');
      var imgPreview = document.getElementById('imgPreview');
      var imgName = document.getElementById('imgName');
      var imgRemove = document.getElementById('imgRemove');
      var plusBtn = document.getElementById('plusBtn');
      var plusMenu = document.getElementById('plusMenu');
      var emojiPanel = document.getElementById('emojiPanel');

      // ====== Emoji 初始化 ======
      var EMOJI_LIST = ['😀','😃','😄','😁','😅','😂','🤣','😊','😇','🙂','😉','😌','😍','🥰','😘','😋','😛','😝','🤪','😎','🤩','🥳','👍','👎','👏','🙌','💪','🤝','👌','✌️','❤️','🧡','💛','💚','💙','💜','🖤','🤍','💔','🔥','⭐','🌟','✨','💫','🎉','🎊','🎈','🎂','🎁','🏆','✅','❌','❓','❗','⚠️','💯','🔴','🟢','🔵','🙏','🤔','😷','🤒','💊','🏠','🏢','🏥','🏨','📞','📱','💻'];
      emojiPanel.innerHTML = '<div style="display:grid;grid-template-columns:repeat(10,1fr);gap:4px">' + EMOJI_LIST.map(function(e) { return '<span style="cursor:pointer;font-size:18px;padding:4px;text-align:center;border-radius:4px" onmouseover="this.style.background=\"#f0f0f0\"}" onmouseout="this.style.background=\"none\"">' + e + '</span>'; }).join('') + '</div>';

      // ====== "+" 按钮 → 切换菜单 ======
      plusBtn.addEventListener('click', function(ev) { ev.stopPropagation(); plusMenu.style.display = plusMenu.style.display === 'none' ? 'block' : 'none'; });

      // ====== 菜单选项 ======
      plusMenu.addEventListener('click', function(ev) {
        var item = ev.target.closest('[data-action]');
        if (!item) return;
        var action = item.getAttribute('data-action');
        plusMenu.style.display = 'none';
        if (action === 'emoji') { emojiPanel.style.display = 'block'; }
        else if (action === 'image') { imgInput.click(); }
        else if (action === 'handoff') { triggerHandoff(); }
      });

      // ====== 表情面板点击 → 插入 ======
      emojiPanel.addEventListener('click', function(ev) {
        var span = ev.target.closest('span'); if (!span) return;
        var e = span.textContent.trim(), v = input.value, s = input.selectionStart || v.length;
        input.value = v.substring(0, s) + e + v.substring(s); input.selectionStart = input.selectionEnd = s + e.length;
        input.focus(); emojiPanel.style.display = 'none';
      });

      // ====== 点击外部关闭 ======
      document.addEventListener('click', function(ev) {
        if (!plusMenu.contains(ev.target) && ev.target !== plusBtn) plusMenu.style.display = 'none';
        if (!emojiPanel.contains(ev.target) && !plusMenu.contains(ev.target) && ev.target !== plusBtn) emojiPanel.style.display = 'none';
      });

      // ====== 转人工 ======
      var handoffActive = false, handoffId = '';
      function triggerHandoff() {
        if (handoffActive) return;
        api('/api/ai/handoff', { userId: userId, conversationId: conversationId, reason: '客户请求转人工' }).then(function(d) {
          if (d.ok) { handoffId = d.handoffId; handoffActive = true; addMsg('assistant', d.message || '已通知顾问，请稍候'); pollHandoff(); }
          else { addMsg('assistant', d.message || '顾问当前不在线，请拨打电话 0779-8525688'); }
        });
      }
      function pollHandoff() {
        if (!handoffActive) return;
        api('/api/ai/handoff-status?id=' + handoffId).then(function(d) {
          (d.messages||[]).forEach(function(m) { addMsg('agent', m.text, m.imageUrl); });
          if (d.status === 'completed') { handoffActive = false; addMsg('assistant', '顾问已结束会话'); }
        });
        if (handoffActive) setTimeout(pollHandoff, 3000);
      }

      var token = localStorage.getItem(STORAGE_TOKEN);
      var user = JSON.parse(localStorage.getItem(STORAGE_USER) || 'null');
      var conversationId = 'chat-' + Math.random().toString(36).slice(2, 14);
      var userId = token ? ('user-' + (user ? user.email : 'u')) : ('anon-' + Math.random().toString(36).slice(2, 12));
      var currentImg = null, currentImgName = '', loading = false, pendingEmail = '';

      function api(path, data) {
        var opts = { method: data ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' } };
        if (token) opts.headers['Authorization'] = 'Bearer ' + token;
        if (data) opts.body = JSON.stringify(data);
        return fetch(path, opts).then(function(r) { return r.json(); });
      }

      function addMsg(role, text, imgUrl) {
        var row = document.createElement('div');
        row.className = 'msg ' + role;
        var bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (imgUrl) { var im = document.createElement('img'); im.src = imgUrl; bubble.appendChild(im); }
        if (text) { var p = document.createElement('p'); p.textContent = text; bubble.appendChild(p); }
        row.appendChild(bubble);
        body.appendChild(row);
        body.scrollTop = body.scrollHeight;
      }

      function clearImg() {
        currentImg = null; currentImgName = '';
        imgInput.value = '';
        plusBtn.style.border = '1px solid rgba(47,122,79,0.18)';
        plusBtn.style.background = '#f6faf7';
        plusBtn.style.color = '#5b846b';
        imgPreview.classList.remove('show');
      }

      function updateAuthUI() {
        var u = JSON.parse(localStorage.getItem(STORAGE_USER) || 'null');
        if (u) {
          authBtn.textContent = u.nickname || u.email || t('auth.logged_in');
          authBtn.classList.add('is-logged-in');
          userId = 'user-' + (u.email || 'u');
        } else {
          authBtn.textContent = t('auth.login');
          authBtn.classList.remove('is-logged-in');
          userId = 'anon-' + Math.random().toString(36).slice(2, 12);
        }
      }

      function showAuthError(msg) { authError.textContent = msg; authError.hidden = false; }
      function hideAuthError() { authError.hidden = true; }

      function switchTab(tab) {
        var tabs = document.querySelectorAll('.auth-tab');
        tabs.forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-tab') === tab); });
        loginForm.hidden = tab !== 'login';
        registerForm.hidden = tab !== 'register';
        verifyForm.hidden = true;
        forgotForm.hidden = true;
        resetForm.hidden = true;
        forgotLink.style.display = tab === 'login' ? '' : 'none';
        hideAuthError();
      }

      authBtn.addEventListener('click', function() {
        if (authBtn.classList.contains('is-logged-in')) {
          if (confirm(t('auth.logout_confirm'))) {
            localStorage.removeItem(STORAGE_TOKEN);
            localStorage.removeItem(STORAGE_USER);
            updateAuthUI();
          }
          return;
        }
        authOverlay.hidden = false;
        switchTab('login');
        loginForm.reset();
        registerForm.reset();
        verifyForm.reset();
        forgotForm.reset();
        resetForm.reset();
      });

      document.querySelectorAll('.auth-tab').forEach(function(t) {
        t.addEventListener('click', function() { switchTab(t.getAttribute('data-tab')); });
      });

      authOverlay.addEventListener('click', function(e) {
        if (e.target === authOverlay) { authOverlay.hidden = true; }
      });

      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var email = loginForm.querySelector('[type=email]').value.trim();
        var pw = loginForm.querySelector('[type=password]').value;
        api('/api/auth/login', { email: email, password: pw }).then(function(d) {
          if (d.ok) {
            token = d.token;
            localStorage.setItem(STORAGE_TOKEN, token);
            localStorage.setItem(STORAGE_USER, JSON.stringify(d.user));
            updateAuthUI();
            authOverlay.hidden = true;
          } else {
            showAuthError(d.message || t('auth.login_failed'));
          }
        });
      });

      registerForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var email = registerForm.querySelector('[type=email]').value.trim();
        var pw = registerForm.querySelector('[type=password]').value;
        pendingEmail = email;
        api('/api/auth/register', { email: email, password: pw }).then(function(d) {
          if (d.ok) {
            verifyEmail.textContent = email;
            loginForm.hidden = true;
            registerForm.hidden = true;
            verifyForm.hidden = false;
            hideAuthError();
          } else {
            showAuthError(d.message || t('auth.register_failed'));
          }
        });
      });

      verifyForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var code = verifyForm.querySelector('input').value.trim();
        api('/api/auth/verify', { email: pendingEmail, code: code }).then(function(d) {
          if (d.ok && d.token) {
            token = d.token;
            localStorage.setItem(STORAGE_TOKEN, token);
            api('/api/auth/login', { email: pendingEmail, password: '' }).then(function(ld) {
              if (ld.ok) {
                localStorage.setItem(STORAGE_USER, JSON.stringify(ld.user));
              }
              updateAuthUI();
              authOverlay.hidden = true;
              switchTab('login');
            });
          } else {
            showAuthError(d.message || t('auth.verify_failed'));
          }
        });
      });

      var forgotForm = document.getElementById('forgotForm');
      var resetForm = document.getElementById('resetForm');
      var forgotLink = document.getElementById('forgotLink');
      var resetEmail = document.getElementById('resetEmail');
      var pendingForgotEmail = '';

      forgotLink.addEventListener('click', function() {
        switchTab('');
        loginForm.hidden = true;
        registerForm.hidden = true;
        verifyForm.hidden = true;
        forgotForm.hidden = false;
        resetForm.hidden = true;
        hideAuthError();
      });

      forgotForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var email = forgotForm.querySelector('[type=email]').value.trim();
        pendingForgotEmail = email;
        api('/api/auth/forgot', { email: email }).then(function(d) {
          if (d.ok) {
            resetEmail.textContent = email;
            forgotForm.hidden = true;
            resetForm.hidden = false;
            hideAuthError();
          } else {
            showAuthError(d.message || t('auth.send_failed'));
          }
        });
      });

      resetForm.addEventListener('submit', function(e) {
        e.preventDefault();
        var code = resetForm.querySelector('[type=text]').value.trim();
        var newPw = resetForm.querySelector('[type=password]').value;
        api('/api/auth/reset-password', { email: pendingForgotEmail, code: code, newPassword: newPw }).then(function(d) {
          if (d.ok) {
            showAuthError(''); hideAuthError();
            alert(t('auth.password_reset_ok'));
            switchTab('login');
            resetForm.reset();
            forgotForm.reset();
          } else {
            showAuthError(d.message || t('auth.reset_failed'));
          }
        });
      });

      imgInput.addEventListener('change', function() {
        var f = imgInput.files[0];
        if (!f) return;
        if (!['image/png','image/jpeg','image/webp'].includes(f.type)) { alert(t('img.unsupported_format')); return; }
        if (f.size > 10*1024*1024) { alert(t('img.too_large_short')); return; }
        var reader = new FileReader();
        reader.onload = function() {
          currentImg = reader.result;
          currentImgName = f.name;
          plusBtn.style.border = '1px solid #2f7a4f';
          plusBtn.style.background = '#e8f5e9';
          imgName.textContent = f.name;
          imgPreview.classList.add('show');
          input.focus();
        };
        reader.readAsDataURL(f);
      });

      imgRemove.addEventListener('click', clearImg);

      function send() {
        var text = input.value.trim();
        if ((!text && !currentImg) || loading) return;
        loading = true;
        var imgToSend = currentImg;
        var imgNameToSend = currentImgName;
        input.value = '';
        addMsg('user', text || t('chat.image_sent'), imgToSend);
        sendBtn.disabled = true;
        sendBtn.textContent = t('chat.sending');
        clearImg();

        api('/api/ai/chat', {
          channel: 'web', question: text, externalUserId: userId,
          conversationId: conversationId, sessionId: 'm-' + Math.random().toString(36).slice(2, 10),
          imageDataUrl: imgToSend || undefined, imageName: imgNameToSend || undefined,
          history: []
        }).then(function(d) {
          if (d.error === 'login_required') {
            addMsg('assistant', t('chatpage.login_required'));
            authOverlay.hidden = false;
          } else {
            addMsg('assistant', d.answer || t('chat.no_reply'));
          }
        }).catch(function() {
          addMsg('assistant', t('chat.network_error'));
        }).finally(function() {
          loading = false;
          sendBtn.disabled = false;
          sendBtn.textContent = t('chat.send');
        });
      }

      sendBtn.addEventListener('click', send);
      input.addEventListener('keydown', function(e) { if (e.key === 'Enter') send(); });

      document.querySelectorAll('.chat-page-quick button').forEach(function(b) {
        b.addEventListener('click', function() { input.value = b.getAttribute('data-q'); send(); });
      });

      // Chat page lang switcher toggle
      (function initChatLangSwitch() {
        var cToggle = document.querySelector('.chat-lang-switch-toggle');
        var cMenu = document.querySelector('.chat-lang-switch-menu');
        if (!cToggle || !cMenu) return;

        cToggle.addEventListener('click', function(e) {
          e.stopPropagation();
          var isOpen = !cMenu.hidden;
          cMenu.hidden = isOpen;
          cToggle.setAttribute('aria-expanded', String(!isOpen));
        });

        cMenu.querySelectorAll('button').forEach(function(b) {
          b.addEventListener('click', function() {
            var lang = b.getAttribute('data-lang');
            if (lang && I) { I.setLang(lang); }
            cMenu.hidden = true;
            cToggle.setAttribute('aria-expanded', 'false');
          });
        });

        document.addEventListener('click', function(e) {
          if (!e.target.closest('.chat-lang-switch')) {
            cMenu.hidden = true;
            cToggle.setAttribute('aria-expanded', 'false');
          }
        });
      })();

      updateAuthUI();
      addMsg('assistant', WELCOME);

      // Apply i18n to auth modal dynamic content
      if (I) { I.apply(); }

      var q = new URLSearchParams(window.location.search).get('q');
      if (q) {
        input.value = q;
        send();
      }
    })();
  </script>
</body>
</html>
