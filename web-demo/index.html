<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>亿库客服中心</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="shell shell-chat">
      <section class="layout">
        <section class="panel chat-panel" aria-labelledby="chatTitle">
          <header class="chat-topbar">
            <div class="chat-topbar-main">
              <button
                type="button"
                id="stealthTrigger"
                class="chat-brand stealth-trigger"
                aria-label="打开隐藏设置"
              >
                广西亿库硅藻板
              </button>
              <h2 id="chatTitle">亿库客服中心</h2>
            </div>
            <div class="chat-topbar-status" aria-label="当前状态">
              <span class="status-dot"></span>
              <span>支持发图</span>
            </div>
          </header>

          <section id="stealthPanel" class="stealth-panel is-hidden" aria-label="隐藏模型设置">
            <div class="stealth-panel-head">
              <strong>模型实验开关</strong>
              <button type="button" id="stealthClose" class="stealth-close" aria-label="关闭隐藏设置">×</button>
            </div>
            <p class="stealth-copy">只影响当前浏览器本地会话，默认文本模型是 `deepseek-v4-flash`。图片仍然继续走智谱，多模态不切到 DeepSeek。</p>
            <div class="stealth-actions" role="group" aria-label="选择模型">
              <button type="button" class="stealth-option" data-model="deepseek-v4-flash">默认模型</button>
              <button type="button" class="stealth-option" data-model="glm-5">切到 glm-5</button>
              <button type="button" class="stealth-option" data-model="glm-4-flash-250414">切到智谱文本</button>
            </div>
            <p id="stealthState" class="stealth-state">当前：默认模型</p>
          </section>

          <div class="quick-actions" aria-label="快捷问题">
            <button type="button" class="quick-question">介绍一下你们这个产品</button>
            <button type="button" class="quick-question">这块板材适合新房用吗？</button>
            <button type="button" class="quick-question">最近准备装修，旁边车流大，卧室午睡总被吵醒，有没有板推荐？</button>
            <button type="button" class="quick-question">把这张图帮我看看，适不适合家装？</button>
          </div>

          <section class="admin-strip" aria-label="管理员链路状态">
            <div class="admin-strip-copy">
              <p class="admin-kicker">Admin</p>
              <div>
                <strong>当前链路状态</strong>
                <p>这里会显示当前前端连接的聊天后端和运行状态。</p>
              </div>
            </div>
            <p class="admin-runtime-note" id="adminRuntimeNote">正在读取当前状态…</p>
          </section>

          <div class="chat">
            <div id="chatLog" class="chat-log" aria-live="polite"></div>
            <form id="chatForm" class="chat-form">
              <div class="chat-tools">
                <span class="tool-hint">可直接发文字，也可以顺手发图</span>
                <label class="upload-chip" for="imageInput" aria-label="上传图片">+</label>
                <input id="imageInput" class="sr-only" type="file" accept="image/png,image/jpeg,image/webp" />
              </div>

              <div id="imagePreview" class="preview-card is-hidden" aria-live="polite">
                <img id="imagePreviewImg" src="" alt="待发送图片预览" />
                <div class="preview-copy">
                  <strong id="imagePreviewName">待发送图片</strong>
                  <p id="imagePreviewMeta">支持 PNG、JPG、WEBP</p>
                </div>
                <button id="clearImageBtn" type="button" class="preview-clear">移除</button>
              </div>

              <div class="composer-row">
                <label class="sr-only" for="chatInput">输入咨询问题</label>
                <input
                  id="chatInput"
                  type="text"
                  placeholder="比如：适合儿童房吗？也可以只发一张图让我帮你看"
                  autocomplete="off"
                />
                <button type="submit">发送</button>
              </div>
            </form>
          </div>
        </section>
      </section>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
